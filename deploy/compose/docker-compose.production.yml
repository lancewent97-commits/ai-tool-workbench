services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "127.0.0.1:${DATABASE_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-production:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.api
    env_file: ${PRODUCTION_ENV_FILE:-../../.env.production.local}
    environment:
      DATABASE_URL: postgres://${DATABASE_USER}:${DATABASE_PASSWORD}@postgres:5432/${DATABASE_NAME}
    command: ["pnpm", "--filter", "@ai-tool-workbench/db", "migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.api
    restart: unless-stopped
    env_file: ${PRODUCTION_ENV_FILE:-../../.env.production.local}
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 3200
      NODE_ENV: production
      PLATFORM_ENV: production
      COOKIE_SECURE: "true"
      DATABASE_URL: postgres://${DATABASE_USER}:${DATABASE_PASSWORD}@postgres:5432/${DATABASE_NAME}
      PLATFORM_STORAGE_ROOT: /data/platform
    volumes:
      - "${PLATFORM_STORAGE_HOST_ROOT:?PLATFORM_STORAGE_HOST_ROOT is required}:/data/platform"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3200/ready').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.web
      args:
        API_INTERNAL_URL: http://api:3200
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:3200
      NODE_ENV: production
      NEXT_PUBLIC_PLATFORM_ENV: production
    depends_on:
      api:
        condition: service_healthy

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web

volumes:
  postgres-production:
