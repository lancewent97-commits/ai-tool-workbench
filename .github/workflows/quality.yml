name: quality

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_tool_workbench
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ai_tool_workbench
      PLATFORM_ENV: test
      PLATFORM_STORAGE_ROOT: var/test
      SESSION_COOKIE_NAME: atw_test_session
      E2E_ACCOUNT: e2e-admin
      E2E_PASSWORD: e2e-local-password-123
      ALLOW_DEMO_SEED: "true"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --registry=https://registry.npmjs.org audit --audit-level high
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm --filter @ai-tool-workbench/api seed:e2e-user
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
