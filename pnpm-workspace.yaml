packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

# Security backports for transitive dependencies whose parent ranges still
# resolve to vulnerable releases. Remove an override once the parent package
# ships the patched version directly.
overrides:
  "ansi-regex@>=4.0.0 <4.1.1": "4.1.1"
  "ansi-regex@>=5.0.0 <5.0.1": "5.0.1"
  "brace-expansion@>=4.0.0 <5.0.9": "5.0.9"
  "postcss@<=8.5.22": "8.5.26"
  "sharp@<0.35.0": "0.35.0"
